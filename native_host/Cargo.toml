[package]
name = "cure_magic_sinker"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
base64 = "0.22.1"
# 这几个 5ever 的版本需要对应上哟
html5ever = "0.36.1"
markup5ever_rcdom = "0.36.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
swc_core = { version = "55.0.0", features = [
    "ecma_plugin_transform",
    "ecma_ast",
    "ecma_parser",
    "ecma_codegen",
    "common",
] }
tokio = { version = "1.49.0", features = ["rt-multi-thread"] }
